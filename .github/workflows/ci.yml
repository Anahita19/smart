name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The test suite runs TypeScript directly through Node's type stripping, which needs Node 22.
          node-version: 22
          cache: npm

      # Fails if package-lock.json is missing or out of date with package.json (that is intended).
      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
